<svg viewBox="0 0 440 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fbl1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ba8d9"/>
      <stop offset="40%" stop-color="#2b7ab5"/>
      <stop offset="100%" stop-color="#1a5e8c"/>
    </linearGradient>
    <linearGradient id="fbl2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a90cc"/>
      <stop offset="100%" stop-color="#1d6490"/>
    </linearGradient>
    <linearGradient id="fgl1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcc060"/>
      <stop offset="40%" stop-color="#c49b30"/>
      <stop offset="100%" stop-color="#a07a20"/>
    </linearGradient>
    <linearGradient id="fgl2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4b040"/>
      <stop offset="100%" stop-color="#b08828"/>
    </linearGradient>
    <filter id="fds" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="#0a0e1a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- FV Mark scaled down into 60x60 area -->
  <g transform="translate(5, 7) scale(0.55)">
    <!-- Gold ribbon back layer -->
    <path d="M 68 18 C 72 16, 78 16, 84 20 C 98 30, 108 48, 106 66 C 104 82, 94 94, 78 100 C 72 102, 66 102, 62 100 L 58 84 C 62 86, 66 86, 70 84 C 80 80, 88 72, 90 60 C 92 48, 86 36, 76 30 C 74 28, 72 28, 70 30 Z" fill="url(#fgl1)"/>
    <!-- Blue ribbon -->
    <path d="M 52 18 C 48 16, 42 16, 36 20 C 22 30, 12 48, 14 66 C 16 82, 26 94, 42 100 C 48 102, 54 102, 58 100 L 62 84 C 58 86, 54 86, 50 84 C 40 80, 32 72, 30 60 C 28 48, 34 36, 44 30 C 46 28, 48 28, 50 30 Z" fill="url(#fbl1)" filter="url(#fds)"/>
    <!-- Blue crossbar -->
    <path d="M 44 44 C 46 40, 52 38, 60 38 L 72 38 C 74 38, 76 40, 76 42 C 76 44, 74 46, 72 46 L 60 48 C 52 48, 46 48, 44 44 Z" fill="url(#fbl2)" filter="url(#fds)"/>
    <!-- Gold front layer -->
    <path d="M 68 18 C 72 16, 76 16, 80 18 L 76 30 C 74 28, 72 28, 70 30 L 68 18 Z" fill="url(#fgl2)"/>
  </g>

  <!-- FORMAVISTA text -->
  <text x="82" y="38" font-family="'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="3">
    FORMA<tspan fill="#c9a84c">VISTA</tspan>
  </text>
  <!-- CONSULTING text -->
  <text x="84" y="58" font-family="'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a92b3" letter-spacing="5.5">
    CONSULTING
  </text>
</svg>
